<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimingCheck - iPhone最適化版</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --beat1: #f59e0b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 { font-size: 1.05rem; margin: 0 0 12px 0; color: var(--accent); text-align: center; }
        
        /* 4拍の光るメトロノームランプ */
        .beat-lamps {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 14px;
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .lamp {
            height: 42px;
            border-radius: 8px;
            background: #1e293b;
            border: 2px solid #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-dim);
            transition: transform 0.05s, background-color 0.05s, box-shadow 0.05s;
        }
        .lamp.lit-1 {
            background-color: var(--beat1);
            border-color: #fde68a;
            color: #000;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.8);
            transform: scale(1.03);
        }
        .lamp.lit-other {
            background-color: var(--accent);
            border-color: #bae6fd;
            color: #000;
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.8);
            transform: scale(1.03);
        }

        /* コントロール共通 */
        .section { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 4px; }
        
        /* BPMコントロール */
        .bpm-control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .bpm-btn {
            background: #334155;
            color: var(--text);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .bpm-btn:active { background: #475569; }
        input[type="range"] { flex: 1; accent-color: var(--accent); }
        .bpm-val { font-size: 1rem; font-weight: bold; min-width: 45px; text-align: right; color: var(--accent); }

        /* 小節数タブ */
        .bar-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .bar-tab {
            flex: 1;
            padding: 6px;
            background: #0f172a;
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .bar-tab.active-tab {
            background: #334155;
            color: var(--accent);
            border-color: var(--accent);
        }

        /* 音量設定 */
        .volume-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #0f172a;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .volume-item { display: flex; flex-direction: column; gap: 2px; }
        .volume-item label { font-size: 0.7rem; margin: 0; }
        .volume-item input { accent-color: #22c55e; }

        /* 小節コンテナと6つのブロック（スマホ対応で2列×3行などに自動調整） */
        .bar-container {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .bar-title {
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 6px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .triplet-grid-6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
        }
        @media (max-width: 480px) {
            .triplet-grid-6 { grid-template-columns: repeat(3, 1fr); }
        }
        .t-block {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 6px;
            padding: 6px 2px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.1s;
        }
        .t-block:hover { border-color: var(--accent); }
        .t-block.active-block {
            border-color: #fff !important;
            background: #334155 !important;
            transform: translateY(-1px);
        }
        .t-block.is-4 { border-bottom: 3px solid #f59e0b; }
        .t-block.is-1 { border-bottom: 3px solid #38bdf8; }
        .t-block.is-0 { border-bottom: 3px solid #64748b; opacity: 0.6; }
        
        .block-label { font-size: 0.55rem; color: var(--text-dim); margin-bottom: 1px; }
        .block-sound { font-size: 0.75rem; font-weight: bold; margin-bottom: 1px; }
        .is-4 .block-sound { color: #fbbf24; }
        .is-1 .block-sound { color: #7dd3fc; }
        .is-0 .block-sound { color: #94a3b8; }
        .block-dots { font-size: 0.6rem; color: var(--text); }

        /* 再生メインボタン */
        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            background-color: #22c55e;
            color: #fff;
            transition: background-color 0.2s;
            margin-top: 4px;
        }
        .main-btn.playing { background-color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h1>TimingCheck</h1>

    <!-- 1. 光るメトロノームランプ -->
    <div class="beat-lamps">
        <div class="lamp" id="lamp-0">1</div>
        <div class="lamp" id="lamp-1">2</div>
        <div class="lamp" id="lamp-2">3</div>
        <div class="lamp" id="lamp-3">4</div>
    </div>

    <!-- 2. テンポ設定 -->
    <div class="section">
        <div class="bpm-control-row">
            <span style="font-size:0.75rem; color:var(--text-dim);">BPM</span>
            <button class="bpm-btn" onclick="changeBpm(-1)">-</button>
            <input type="range" id="bpmRange" min="40" max="150" value="75" oninput="updateBpm(this.value)">
            <button class="bpm-btn" onclick="changeBpm(1)">+</button>
            <span class="bpm-val" id="bpmVal">75</span>
        </div>
    </div>

    <!-- 3. 音量調節 -->
    <div class="section">
        <div class="volume-row">
            <div class="volume-item">
                <label>ガイド音: <span id="volGuideVal">70</span>%</label>
                <input type="range" id="volGuideRange" min="0" max="100" value="70" oninput="volGuide = this.value/100; document.getElementById('volGuideVal').textContent=this.value;">
            </div>
            <div class="volume-item">
                <label>正解音: <span id="volToneVal">80</span>%</label>
                <input type="range" id="volToneRange" min="0" max="100" value="80" oninput="volTone = this.value/100; document.getElementById('volToneVal').textContent=this.value;">
            </div>
        </div>
    </div>

    <!-- 4. 小節数タブ -->
    <div class="bar-tabs">
        <div class="bar-tab active-tab" id="tab-1" onclick="setBars(1)">1小節（6打）</div>
        <div class="bar-tab" id="tab-2" onclick="setBars(2)">2小節（12打）</div>
    </div>

    <!-- 5. 6打ブロック編集エリア -->
    <div class="section" id="barsContainer"></div>

    <!-- 再生・停止ボタン -->
    <button class="main-btn" id="mainBtn" onclick="togglePlay()">再生する</button>
</div>

<script>
    let audioCtx = null;
    let isPlaying = false;
    let bpm = 75;
    let timerID = null;

    let numBars = 1;
    let blocks = [4, 1, 4, 1, 4, 1]; // デフォルトは譜面[4C]1段目相当

    let volGuide = 0.7;
    let volTone = 0.8;

    let currentTick = 0;
    let nextTickTime = 0.0;

    function setBars(bars) {
        if (isPlaying) stopPlay();
        numBars = bars;
        document.getElementById('tab-1').classList.toggle('active-tab', bars === 1);
        document.getElementById('tab-2').classList.toggle('active-tab', bars === 2);
        
        if (bars === 1 && blocks.length > 6) {
            blocks = blocks.slice(0, 6);
        } else if (bars === 2 && blocks.length === 6) {
            blocks = [...blocks, 4, 1, 4, 1, 4, 1];
        }
        renderBars();
    }

    function renderBars() {
        const container = document.getElementById('barsContainer');
        container.innerHTML = '';

        for (let b = 0; b < numBars; b++) {
            const barDiv = document.createElement('div');
            barDiv.className = 'bar-container';
            
            barDiv.innerHTML = `
                <div class="bar-title">
                    <span>${b + 1}小節目</span>
                    <span>6打（前3・後3）</span>
                </div>
                <div class="triplet-grid-6" id="bar-blocks-${b}"></div>
            `;
            container.appendChild(barDiv);

            const gridEl = document.getElementById(`bar-blocks-${b}`);
            for (let i = 0; i < 6; i++) {
                const idx = b * 6 + i;
                const val = blocks[idx];
                const div = document.createElement('div');
                
                let cssClass = 'is-4';
                let soundLabel = 'タタタタ';
                let dots = '>';
                if (val === 1) {
                    cssClass = 'is-1';
                    soundLabel = 'ターーー';
                    dots = '•';
                } else if (val === 0) {
                    cssClass = 'is-0';
                    soundLabel = 'ーーーー';
                    dots = 'ー';
                }

                div.className = `t-block ${cssClass}`;
                div.id = `block-${idx}`;
                
                div.innerHTML = `
                    <div class="block-label">${i < 3 ? '前' : '后'}${ (i % 3) + 1 }</div>
                    <div class="block-sound">${soundLabel}</div>
                    <div class="block-dots">${dots}</div>
                `;
                div.onclick = () => {
                    if (blocks[idx] === 4) blocks[idx] = 1;
                    else if (blocks[idx] === 1) blocks[idx] = 0;
                    else blocks[idx] = 4;
                    renderBars();
                };
                gridEl.appendChild(div);
            }
        }
    }

    function updateBpm(val) {
        bpm = Number(val);
        document.getElementById('bpmRange').value = bpm;
        document.getElementById('bpmVal').textContent = bpm;
    }

    function changeBpm(amount) {
        let newBpm = bpm + amount;
        if (newBpm < 40) newBpm = 40;
        if (newBpm > 150) newBpm = 150;
        updateBpm(newBpm);
    }

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function triggerTone(kind, time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let v = (kind.startsWith('click')) ? volGuide : volTone;
        if (v <= 0) return;

        if (kind === 'click1') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1400, time);
            gain.gain.setValueAtTime(0.4 * v, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
            osc.start(time);
            osc.stop(time + 0.04);
        } else if (kind === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(950, time);
            gain.gain.setValueAtTime(0.3 * v, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.035);
            osc.start(time);
            osc.stop(time + 0.04);
        } else if (kind === 'accent') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(900, time);
            osc.frequency.exponentialRampToValueAtTime(300, time + 0.04);
            gain.gain.setValueAtTime(0.7 * v, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
            osc.start(time);
            osc.stop(time + 0.05);
        } else if (kind === 'normal') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(650, time);
            osc.frequency.exponentialRampToValueAtTime(220, time + 0.04);
            gain.gain.setValueAtTime(0.5 * v, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
            osc.start(time);
            osc.stop(time + 0.05);
        }
    }

    function flashLamp(beatIdx) {
        for (let i = 0; i < 4; i++) {
            const el = document.getElementById(`lamp-${i}`);
            el.classList.remove('lit-1', 'lit-other');
        }
        const target = document.getElementById(`lamp-${beatIdx}`);
        if (target) {
            target.classList.add(beatIdx === 0 ? 'lit-1' : 'lit-other');
            setTimeout(() => {
                target.classList.remove('lit-1', 'lit-other');
            }, 140);
        }
    }

    function highlightBlock(blockIdx) {
        document.querySelectorAll('.t-block').forEach((el, i) => {
            el.classList.toggle('active-block', i === blockIdx);
        });
    }

    function scheduler() {
        const totalTicks = numBars * 24;
        const tickDuration = (60.0 / bpm) / 6.0;

        while (nextTickTime < audioCtx.currentTime + 0.1) {
            const tick = currentTick;
            const time = nextTickTime;
            const delayMs = Math.max(0, (time - audioCtx.currentTime) * 1000);

            if (tick % 6 === 0) {
                const beatIdx = (tick / 6) % 4;
                triggerTone(beatIdx === 0 ? 'click1' : 'click', time);
                setTimeout(() => flashLamp(beatIdx), delayMs);
            }

            const blockIdx = Math.floor(tick / 4);
            const subTick = tick % 4;
            const blockType = blocks[blockIdx];

            if (subTick === 0) {
                setTimeout(() => highlightBlock(blockIdx), delayMs);
            }

            if (blockType === 4) {
                triggerTone(subTick === 0 ? 'accent' : 'normal', time);
            } else if (blockType === 1) {
                if (subTick === 0) triggerTone('normal', time);
            }

            nextTickTime += tickDuration;
            currentTick = (currentTick + 1) % totalTicks;
        }
    }

    function togglePlay() {
        initAudio();
        if (isPlaying) {
            stopPlay();
            return;
        }
        isPlaying = true;
        const btn = document.getElementById('mainBtn');
        btn.textContent = '停止する';
        btn.classList.add('playing');
        
        currentTick = 0;
        nextTickTime = audioCtx.currentTime + 0.05;
        timerID = setInterval(scheduler, 20);
    }

    function stopPlay() {
        isPlaying = false;
        clearInterval(timerID);
        const btn = document.getElementById('mainBtn');
        btn.textContent = '再生する';
        btn.classList.remove('playing');
        document.querySelectorAll('.t-block').forEach(el => el.classList.remove('active-block'));
        for (let i = 0; i < 4; i++) {
            document.getElementById(`lamp-${i}`).classList.remove('lit-1', 'lit-other');
        }
    }

    renderBars();
</script>

</body>
</html>
